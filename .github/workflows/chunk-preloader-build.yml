name: ChunkPreloader build

on:
  push:
    paths:
      - 'chunk-preloader/**'
      - '.github/workflows/chunk-preloader-build.yml'
    paths-ignore:
      - 'chunk-preloader/out/**'
  pull_request:
    paths:
      - 'chunk-preloader/**'
      - '.github/workflows/chunk-preloader-build.yml'
    paths-ignore:
      - 'chunk-preloader/out/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chunk-preloader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ChunkPreloader
        working-directory: chunk-preloader
        run: mvn -B -ntp -U package

      - name: Copy jar into out/
        run: |
          mkdir -p chunk-preloader/out
          cp chunk-preloader/target/ChunkPreloader-*.jar chunk-preloader/out/

      - name: Commit jar to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chunk-preloader/out
          if git diff --cached --quiet; then
            echo "No jar change to commit"
          else
            git commit -m "Build ChunkPreloader jar [skip ci]"
            git push
          fi

      - name: Upload plugin jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChunkPreloader
          path: chunk-preloader/out/ChunkPreloader-*.jar
          if-no-files-found: error
